name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path: no R. Compares against the committed fixtures, which is what
  # every contributor runs locally too.
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # geo+aqeval so the optional code paths are exercised; plots is left
          # out on purpose, so an accidental hard dependency on plotnine fails
          # here rather than in someone's container.
          python -m pip install -e ".[geo,aqeval,dev]"

      - name: Lint
        run: python -m ruff check src tests parity tools

      - name: Test
        run: python -m pytest -q

  # The core package must work with nothing optional installed -- that is what
  # a slim backend image will actually have.
  minimal-install:
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Import and run an analysis without any extra
        run: |
          python - <<'PY'
          import dteval as dte
          d = dte.datasets.dt_brd()
          assert len(dte.tag_tube(d)) == 11273
          assert len(dte.calc_tube_stat(d, by="year_of_measurement")) == 4
          res = dte.test_tube_precision(d, show=[])
          assert set(res) == {"data", "plot", "lookup", "report"}
          import json; json.dumps(res["plot"].to_spec())   # serialises with no extras
          assert dte.deseason_tube_data(d, ".value", by=".location").shape[0] == 5868
          assert dte.cluster_tube_data(d, tube=".value", by=".location",
                                       clusters=2, method=2).shape[0] == 11273
          print(res["report"])
          print("core package OK without geo/aqeval/plots")
          PY

  # Slow path: regenerate the fixtures from live R and prove they still match
  # what is committed. This is what stops the reference values going stale.
  parity-live:
    name: parity vs live R
    # Not on push-to-main: the job builds an R container and regenerates every
    # fixture, and main is already covered by `test` on every push and by this
    # job on the PR that introduced the change.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container:
      image: rocker/r-ver:4.6.1
    steps:
      - uses: actions/checkout@v7

      - name: Trust the workspace
        # The job runs in a container as root over a mounted workspace, which
        # trips git's dubious-ownership check; `git diff` below needs it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: System dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv git \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Cache the R library
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/R/site-library
          key: r-${{ runner.os }}-4.6.1-${{ hashFiles('parity/generate.R', 'tools/build_r_shims.R') }}

      - name: R packages
        run: |
          Rscript -e 'p <- c("jsonlite","yaml","data.table","ggplot2","sf","mgcv","cluster","leaflet");
                      m <- p[!p %in% rownames(installed.packages())];
                      if (length(m)) install.packages(m, repos="https://cloud.r-project.org")'

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[geo,aqeval,dev]"

      - name: Pinned upstream DTEval
        run: make r-reference

      - name: Build the loa/AQEval/OpenStreetMap shims
        # See tools/build_r_shims.R: the real AQEval needs rJava and hence a
        # JDK, which none of its two functions actually use, and OpenStreetMap
        # needs rJava to fetch basemap tiles that are outside parity scope.
        run: make r-shims

      - name: Regenerate every fixture from live R
        run: |
          Rscript parity/generate_rcompat.R
          Rscript parity/generate.R

      - name: Provenance differences (informational)
        # _lock.json and _shims.json record the machine that generated the
        # fixtures -- R package versions, which shims were needed. Those
        # legitimately differ between a maintainer's laptop and this container,
        # so they are reported rather than gated. What they must NOT do is
        # change the upstream SHA or source hash, and tests/test_lock.py gates
        # that on every run.
        if: always()
        run: |
          git diff --stat -- parity/fixtures/_lock.json parity/fixtures/_shims.json || true

      - name: Fixtures must be unchanged
        # If this fails, either the committed fixtures are stale or live R now
        # produces different values. Both need a human; neither should pass
        # silently.
        #
        # Note this asserts BYTE identity of the regenerated fixtures, which
        # also requires this container to agree with the generating machine on
        # floating-point accumulation -- R sums in long double where the build
        # has it, and the fixtures carry 17 significant digits. If that is what
        # fails here, the diff below will show last-digit-only changes, and the
        # gate should move to the comparator's tolerance rather than bytes.
        run: |
          changed=$(git diff --name-only -- parity/fixtures/ \
                    | grep -v '_lock.json\|_shims.json' || true)
          if [ -n "$changed" ]; then
            echo "::error::Regenerated fixtures differ from those committed."
            echo "$changed"
            echo "--- first differing fixture, decoded ---"
            first=$(echo "$changed" | head -1)
            git show "HEAD:$first" > /tmp/old.json.gz
            .venv/bin/python - "$first" <<'PY'
          import gzip, json, sys
          new = json.load(gzip.open(sys.argv[1]))
          old = json.load(gzip.open("/tmp/old.json.gz"))
          print("committed :", json.dumps(old)[:600])
          print("regenerated:", json.dumps(new)[:600])
          PY
            exit 1
          fi
          echo "all fixtures byte-identical to those committed"

      - name: Parity suite against the freshly generated fixtures
        run: .venv/bin/python -m pytest -q -m parity
