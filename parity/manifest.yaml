    r: tubeInXYPolygon(dt.brd, caz.brd, rename = "in.caz")
    py: dte.tube_in_xy_polygon(dte.datasets.dt_brd(), dte.datasets.caz_brd(), rename="in.caz")
    row_order_artifact: [".longitude", ".latitude", "site", ".start_date", ".end_date"]
    reason: >-
      Values, columns and column order are compared exactly; only the relative
      order of rows sharing an identical coordinate pair is canonicalised
      first. R's merge() is stable for small inputs but not at this scale --
      one 11,273-row coordinate group comes back as rows 9550, 9549, 3392,
      195, ... -- because merge.data.frame's row order within a tie comes from
      the C do_merge index, not from a stable sort. That order is an internal
      artifact rather than a documented output, and every tube here shares its
      location with its own replicates, so nothing downstream depends on it
      (callers group or sort anyway). Reproducing it would mean porting R's C
      merge; if that ordering ever turns out to matter, this is the case to
      revisit.

