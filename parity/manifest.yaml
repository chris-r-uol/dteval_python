  - id: plot/testTubeMeta.type2
    r: 'testTubeMeta(dt.brd)'
    py: 'dte.test_tube_meta(dte.datasets.dt_brd())'
    row_order_artifact: ["variable", "ref", "..type", "value"]
    row_order_reason: >-
      plot.type 2 keeps one stacked segment per group rather than aggregating,
      and the per-sample segments come out in .sample_id order. That numbering
      is R's as.numeric(factor(paste(lat, lon, dates))) -- arbitrary, and one of
      the two things this port derives differently (see the .sample_id note on
      the precision cases). Segment order within a stacked bar carries no
      meaning, so the frames are compared as multisets: all 91,110 rows match
      exactly on variable, ref, value and ..type.
  - id: plot/testTubeMeta.type1
    r: 'testTubeMeta(dt.brd, plot.type = 1)'
    py: 'dte.test_tube_meta(dte.datasets.dt_brd(), plot_type=1)'
