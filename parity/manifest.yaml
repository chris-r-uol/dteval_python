# Parity case manifest -- the single source of truth for R-vs-Python comparison.
#
# Each case gives the R expression and the Python expression side by side, so
# the two can be read against each other in one place. The R side is evaluated
# by parity/generate.R and serialised to parity/fixtures/<id>.json; the Python
# side is evaluated by tests/test_parity.py and compared against that fixture.
#
# Fields
#   id         unique, becomes the fixture filename
#   r          R expression, evaluated with DTEval + datasets attached
#   py         Python expression, evaluated with `dteval as dte` and datasets in scope
#   compare    optional dotted path into the result (e.g. "lookup") to compare
#              instead of the whole value
#   gating     default true. false = deviation is reported but does not fail CI
#   tol        override the default relative tolerance. REQUIRES `reason`.
#   tol_columns  columns needing a different bound; a list (all take `tol`) or
#              a mapping of column -> tolerance
#   reason     why the override is justified. Mandatory whenever tol is set.
#   label_columns  columns whose *grouping* must match R but whose values need
#              not (e.g. .sample_id). Checked as a bijection.
#   row_order_artifact  canonicalise row order on these columns before
#              comparing, where R's own order is an internal artifact.
#
# Floats are compared to compare.DEFAULT_TOL (1e-6) -- see that module for why
# not zero. Structure is always exact: column names and order, row count and
# order, dtypes, factor levels, NA-vs-NaN, and every integer, string, date and
# boolean. An override without a documented reason is a bug, not a convenience.

meta:
  upstream_repo: https://github.com/karlropkins/DTEval
  upstream_sha: 08a6cbda6d5703ef564f076f5ae5aafc1d7ad6d6
  locale:
    LC_COLLATE: C
    LC_TIME: C
    LC_NUMERIC: C

cases:
  # --- datasets: the port must start from byte-identical inputs -------------
  - id: data/dt.brd
    r: dt.brd
    py: dte.datasets.dt_brd()
  - id: data/dt.calendar
    r: dt.calendar
    py: dte.datasets.dt_calendar()

  # --- tagging --------------------------------------------------------------
  - id: tag/tagTube.default
    r: tagTube(dt.brd)
    py: dte.tag_tube(dte.datasets.dt_brd())
    label_columns: [".sample_id"]
    label_reason: >-
      .sample_id numbers replicate sets. R derives its integers by pasting the
      location and dates into a string and taking as.numeric(factor(.)), so the
      labels depend on R's double-to-string formatting and on collation order;
      we group on the (lat, lon, start, end) tuple directly. The comparison
      checks the induced *partition* matches R's as a bijection -- two rows
      share a label here exactly when they do in R -- so a real mis-grouping
      still fails, while the arbitrary numbering does not have to agree.

  - id: tag/tagTubeStartEnd.m1
    r: tagTubeStartEnd(dt.brd[setdiff(names(dt.brd), c(".start_date", ".end_date"))], method = 1)
    py: dte.tag_tube_start_end(dte.datasets.dt_brd().drop(columns=[".start_date", ".end_date"]), method=1)
  - id: tag/tagTubeStartEnd.m2
