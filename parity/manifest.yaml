  # --- gam surface ----------------------------------------------------------
  - id: fit/gam.location
    r: 'fitTubeModel(dt.brd, tube = ".value", inputs = c(".longitude", ".latitude"), model = fitTubeModel_gam)'
    py: 'dte.fit_tube_model(dte.datasets.dt_brd(), tube=".value", inputs=[".longitude", ".latitude"], model=dte.fit_tube_model_gam)'
    gating: false
    reason: >-
      Structure matches exactly -- columns, column order, row count, and every
      input column. The fitted surface does not, and this is the one model in
      the port that is close rather than equal.

      R fits with mgcv::gam(y ~ te(lon, lat)). The port reproduces mgcv's
      construction directly (cubic-regression-spline marginals, k = 5, knots at
      quantiles of the unique values, tensor-product basis, one penalty per
      marginal direction, GCV) but not its optimiser: mgcv uses a nested Newton
      scheme with its own reparameterisations, and the GCV objective here is
      very flat near its minimum -- 44.30 at our 24.6 effective degrees of
      freedom against 44.64 at 19.5. R settles at 22.8 edf inside that same
      flat region.

      Measured over all 11,273 rows of dt.brd, our fit against R's:
      median 0.033, p95 0.17, max 1.32 ug/m3, correlation 0.99967. The tube
      measurement error is around 10%, i.e. ~2.4 ug/m3, so the worst case sits
      inside it. Pinned by tests/test_gam.py so it cannot drift unnoticed.
